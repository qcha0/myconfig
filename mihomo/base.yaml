# =============================================================================
# base.yaml —— mihomo 共享基础配置（macOS FlClash + OpenWrt nikki 共用）
# -----------------------------------------------------------------------------
# 本文件只放"两端一致"的内容：节点来源、策略组、规则、DNS。
# 设备相关项（mixed-port / allow-lan / external-controller / secret /
# tproxy-port / tun / find-process-mode / log-level）在 overlays/ 下，用 scripts/build-configs.sh
# 合并成 router.yaml 给 nikki；macOS 上直接把本文件导入 FlClash 即可，
# 端口/TUN/API 由 FlClash 自己注入。
#
# 订阅地址等同于账号凭据，勿公开托管。
# 规则源说明见文末注释。
# =============================================================================

mode: rule
ipv6: false

# 延迟与连接效率
unified-delay: true          # 用同一口径计算延迟，避免 url-test 误判
tcp-concurrent: true         # 多 IP 目标并发握手

# geo 数据自动更新（GEOIP,CN 需要）
geo-auto-update: true
geo-update-interval: 24

profile:
  store-selected: false      # 与 FlClash 行为一致：选择不落盘，靠 default-selected

# =============================================================================
# 节点来源：机场订阅按 Clash UA 拉取（同一个 URL 对 QX UA 返回的是 QX 格式）
# =============================================================================
proxy-providers:
  airport:
    type: http
    url: "__SUBSCRIPTION_URL__"
    interval: 86400
    path: ./providers/airport.yaml
    header:
      User-Agent: ["clash.meta"]
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 600
    # 订阅里的流量/到期提示节点，不能参与测速
    exclude-filter: "(?i)(剩余|到期|重置|套餐|流量|客户端|官网|客服|邀请|返利|广告|售后|过滤|失联|电报|Telegram|TG)"

# =============================================================================
# 策略组
# =============================================================================
proxy-groups:
  - name: 节点选择
    type: select
    proxies: [自动选择, SG, JP, US, US固定, TW, DIRECT]

  - name: 自动选择
    type: url-test
    use: [airport]
    exclude-filter: "(?i)(剩余|到期|重置|套餐|流量|客户端|官网|客服|邀请|返利|广告|售后|过滤|失联|电报|Telegram|TG)"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 80
    lazy: true
    icon: https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Global.png

  - name: SG
    type: url-test
    use: [airport]
    filter: "(?i)(新加坡|🇸🇬)"
    exclude-filter: "(?i)(剩余|到期|重置|套餐|流量|客户端)"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    lazy: true

  - name: JP
    type: url-test
    use: [airport]
    filter: "(?i)(日本|🇯🇵)"
    exclude-filter: "(?i)(剩余|到期|重置|套餐|流量|客户端)"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    lazy: true

  - name: US
    type: url-test
    use: [airport]
    filter: "(?i)(美国|美國|🇺🇸)"
    exclude-filter: "(?i)(剩余|到期|重置|套餐|流量|客户端)"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    lazy: true

  - name: TW
    type: url-test
    use: [airport]
    filter: "(?i)(台湾|台灣|🇹🇼)"
    exclude-filter: "(?i)(剩余|到期|重置|套餐|流量|客户端)"
    url: https://www.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    lazy: true

  # AI 固定出口：默认锁定一个"三网推荐"的美国节点，IP 稳定优先于延迟
  - name: US固定
    type: select
    use: [airport]
    filter: "(?i)(美国|美國|🇺🇸)"
    exclude-filter: "(?i)(0\\.01倍|下载|剩余|到期|重置|套餐|流量|客户端)"
    default-selected: '🇺🇸美国圣何塞01-0.1倍'

  - name: US手选
    type: select
    use: [airport]
    filter: "(?i)(美国|美國|🇺🇸)"
    exclude-filter: "(?i)(剩余|到期|重置|套餐|流量|客户端)"

  # ---- AI：按厂商分组，先于 Google / 媒体规则命中 ----
  - name: AI-OpenAI          # ChatGPT / Codex / API
    type: select
    proxies: [US固定, US手选, US, 自动选择]
  - name: AI-Claude          # Claude / Claude Code / MCP
    type: select
    proxies: [US固定, US手选, US, 自动选择]
  - name: AI-Gemini          # Gemini / AI Studio / NotebookLM
    type: select
    proxies: [US固定, US手选, US, 自动选择]
  - name: AI-Grok            # Grok / xAI
    type: select
    proxies: [US固定, US手选, US, 自动选择]

  - name: Google
    type: select
    proxies: [SG, JP, US, 自动选择, DIRECT]
  - name: YouTube
    type: select
    proxies: [JP, SG, US, 自动选择]
  - name: Netflix
    type: select
    proxies: [SG, JP, US, 自动选择]
  - name: Spotify
    type: select
    proxies: [US, SG, JP, 自动选择]
  - name: Telegram
    type: select
    proxies: [SG, JP, US, 自动选择]
  - name: X
    type: select
    proxies: [US, SG, JP, 自动选择]
  - name: PayPal
    type: select
    proxies: [US, 自动选择, DIRECT]
  - name: Microsoft
    type: select
    proxies: [SG, JP, US, 自动选择]
  - name: Apple
    type: select
    proxies: [DIRECT, 自动选择, 节点选择]
  - name: Steam
    type: select
    proxies: [SG, JP, US, 自动选择, DIRECT]
  - name: Crypto
    type: select
    proxies: [US, SG, JP, 自动选择, DIRECT]
  - name: Media
    type: select
    proxies: [SG, JP, US, 自动选择, DIRECT]
  - name: Game
    type: select
    proxies: [DIRECT, SG, JP, US, 自动选择]
  - name: CN
    type: select
    proxies: [DIRECT, 节点选择]
  - name: 广告
    type: select
    proxies: [REJECT, DIRECT]
  - name: 漏网之鱼
    type: select
    proxies: [节点选择, 自动选择, DIRECT]

