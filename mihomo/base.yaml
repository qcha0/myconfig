# =============================================================================
# DNS
#   listen 固定在 127.0.0.1:1053：路由器上由 dnsmasq 转发（CN 域名不进这里），
#   macOS 上 FlClash 自己用 dns-hijack 接管，二者都不影响系统 DNS。
# =============================================================================
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  cache-algorithm: arc
  default-nameserver: [223.5.5.5, 119.29.29.29]
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

  # 国内 CDN / 大厂域名用就近 DNS（沿用 QuantumultX.conf 的策略）
  nameserver-policy:
    '+.taobao.com': 223.5.5.5
    '+.tmall.com': 223.5.5.5
    '+.alipay.com': 223.5.5.5
    '+.alicdn.com': 223.5.5.5
    '+.aliyun.com': 223.5.5.5
    '+.jd.com': 119.28.28.28
    '+.qq.com': 119.28.28.28
    '+.tencent.com': 119.29.29.29
    '+.bilibili.com': 119.29.29.29
    '+.hdslb.com': 119.29.29.29
    '+.163.com': 119.29.29.29
    '+.126.com': 119.29.29.29
    '+.126.net': 119.29.29.29
    '+.127.net': 119.29.29.29
    '+.netease.com': 119.29.29.29
    '+.mi.com': 119.29.29.29
    '+.xiaomi.com': 119.29.29.29
    '+.icloud.com': 119.29.29.29
    '+.icloud.com.cn': 119.29.29.29
    '+.weixin.com': 119.29.29.29

  # 这些域名不做 fake-IP 映射：银行/运营商类 App 会检测 198.18.x
  fake-ip-filter:
    - '+.cmpassport.com'
    - '+.jegotrip.com.cn'
    - '+.icitymobile.mobi'
    - '+.pingan.com.cn'
    - '+.pingan.com'
    - '+.cmbchina.com'
    - '+.cmbchina.com.cn'
    - '+.icbc.com.cn'
    - '+.icbc.com'
    - '+.95599.cn'
    - '+.abchina.com.cn'
    - '+.bscabank.com'
    - '+.openaboc.cn'
    - '+.openaboc.com'
    - '+.openaboc.com.cn'
    - '+.ccb.com'
    - '+.ccb.com.cn'
    - '+.bocomm.com'
    - '+.bankcomm.com'
    - '+.psbc.com'
    - '+.cmbc.com.cn'
    - '+.ceb.com.cn'
    - '+.citic.com'
    - '+.ecitic.com'
    - '+.spdb.com.cn'
    - '+.id6.me'
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - '+.localnetwork.uop'
    - 'captive.apple.com'
    - '+.ntp.org'

# =============================================================================
# 流量嗅探：让"只有 IP 没有域名"的连接也能命中域名规则
# =============================================================================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
